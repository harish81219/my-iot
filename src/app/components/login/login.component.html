<!-- Show full-screen animation when isLoggingIn is true -->
<div *ngIf="isLoggingIn; else loginPageTemplate" class="flex justify-center items-center h-screen bg-black">
  <ng-lottie [options]="options" width="300px" height="300px"></ng-lottie>
</div>

<!-- Login Page -->
<ng-template #loginPageTemplate>
  <div class="flex items-center justify-center h-screen relative overflow-hidden">
    <!-- Animated Gradient Background -->
    <div class="absolute inset-0 bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 animate-gradientBackground opacity-80"></div>

    <!-- Floating Particles (Optional) -->
    <div class="absolute inset-0 pointer-events-none animate-particles"></div>

    <!-- Login Box -->
    <div class="relative z-10 bg-white p-8 rounded-lg shadow-2xl w-full max-w-md animate-float">
      <h2 class="text-4xl font-extrabold text-center text-gray-800 mb-6 animate-glow">Login</h2>

      <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-gray-600 mb-2">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            formControlName="username"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-md bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all duration-300 transform focus:scale-105 hover:scale-105 hover:shadow-inputNeon"
            placeholder="Enter your username"
          />
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-600 mb-2">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            formControlName="pwd"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-md bg-transparent text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all duration-300 transform focus:scale-105 hover:scale-105 hover:shadow-inputNeon"
            placeholder="Enter your password"
          />
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full py-3 bg-pink-500 text-white font-semibold rounded-md shadow-md hover:bg-pink-600 hover:shadow-buttonNeon transform transition-all duration-300 hover:scale-110 focus:outline-none focus:ring-2 focus:ring-white/70">
          Login
        </button>
      </form>
    </div>
  </div>
</ng-template>
