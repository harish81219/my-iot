
  
<div class="wrapper">
    <!-- Sidebar -->
<app-sidenav></app-sidenav>
    <!-- End Sidebar -->

    <div class="main-panel">
<app-topnav></app-topnav>

<div class="container rate-us-container">
    <div class="page-inner">
      <nz-page-header class="site-page-header" nzBackIcon>
        <nz-page-header-title>Rate Us</nz-page-header-title>
      </nz-page-header>
  
      <div class="row justify-content-center">
        <div class="col-md-12">
          <div class="card rate-card">
            <h2 class="text-center">Rate Us</h2>
  
            <!-- Star Rating Component -->
            <div class="rating-section">
              <nz-rate [(ngModel)]="rating" (ngModelChange)="updateAnimation()"></nz-rate>
            </div>
  
            <p class="feedback-text">
              We value your feedback! Please rate your experience.
            </p>
  
            <!-- Custom Star Icons -->
            <div class="stars">
              <span *ngFor="let star of stars; let i = index" (click)="rate(i + 1)">
                <i class="fa" [ngClass]="i < rating ? 'fa-star checked' : 'fa-star-o'"></i>
              </span>
            </div>
  
            <!-- Feedback Textarea -->
            <textarea [(ngModel)]="feedback" placeholder="Leave your feedback..."></textarea>
  
            <!-- Submit Button -->
            <button class="submit-btn" (click)="submitFeedback()">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  

  <app-footer></app-footer>
    </div>

 
    <!-- End Custom template -->
  </div>
  <!--   Core JS Files   -->
